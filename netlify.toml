[build]
  # Site estático de arquivo único — sem build de código.
  # O "command" apenas REMOVE do output publicado os arquivos de
  # documentação/notas (*.md) — eles continuam no repositório, mas não
  # ficam acessíveis pelo site. Cobre CLAUDE.md, README.md e qualquer
  # outro .md que exista ou venha a existir na raiz.
  publish = "."
  command = "rm -rf ./tools && rm -f ./*.md ./*.markdown"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Censo 2022, um arquivo por UF.
#
# A ORDEM IMPORTA: a Netlify aplica a primeira regra que casa, e "/censo/*"
# casaria também com o manifesto. Por isso o manifesto vem ANTES. Não inverta.
#
# O manifesto tem cache curto porque é ele que anuncia um estado novo — se
# ficasse preso no cache, a UF recém-publicada não apareceria para quem já
# visitou o site.
[[headers]]
  for = "/censo/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Os arquivos de UF são grandes e mudam raramente, mas NÃO são "immutable":
# o SP atual vem de uma fonte de geometria incompleta (faltam ~10% dos
# setores) e deve ser regerado. Com "immutable" o visitante ficaria um ano
# preso na versão velha. Um dia de cache + revalidação por ETag dá o mesmo
# ganho prático sem esse risco.
[[headers]]
  for = "/censo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Bloqueio de arquivos de configuração conhecidos (retorna 404).
# Redirects só casam caminhos exatos (não curinga por extensão), por isso
# os .md são tratados pelo "command" acima, e os configs são listados aqui.
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
