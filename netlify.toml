[build]
  # Site estático de arquivo único — sem build de código.
  # O "command" apenas REMOVE do output publicado os arquivos de
  # documentação/notas (*.md) — eles continuam no repositório, mas não
  # ficam acessíveis pelo site. Cobre CLAUDE.md, README.md e qualquer
  # outro .md que exista ou venha a existir na raiz.
  publish = "."
  command = "rm -rf ./tools && rm -f ./*.md ./*.markdown"

# Único código de servidor do projeto: netlify/functions/isocrona.mjs,
# que guarda a chave do OpenRouteService fora do app.html.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Censo 2022, um arquivo por UF.
#
# A ORDEM IMPORTA: a Netlify aplica a primeira regra que casa, e "/censo/*"
# casaria também com o manifesto. Por isso o manifesto vem ANTES. Não inverta.
#
# O manifesto tem cache curto porque é ele que anuncia um estado novo — se
# ficasse preso no cache, a UF recém-publicada não apareceria para quem já
# visitou o site.
[[headers]]
  for = "/censo/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Arquivos de UF: um dia de cache. NÃO são "immutable" porque a base de um
# estado pode ser refeita (o SP foi, ao migrar para polígonos).
#
# ATENÇÃO: max-age sem must-revalidate significa que, DENTRO da janela de um
# dia, o navegador nem pergunta — serve do cache. Então trocar o CONTEÚDO de
# um arquivo sem trocar o NOME faz o visitante recente combinar manifesto
# novo com dado velho, e o painel apresenta número subnotificado sem avisar.
# Por isso a regra: conteúdo novo, nome novo (ex.: 35.json -> 35-v2.json),
# com o manifesto apontando para ele. O manifesto propaga em 5 minutos.
[[headers]]
  for = "/censo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Bloqueio de arquivos de configuração conhecidos (retorna 404).
# Redirects só casam caminhos exatos (não curinga por extensão), por isso
# os .md são tratados pelo "command" acima, e os configs são listados aqui.
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# O CÓDIGO DA FUNÇÃO não deve ser servido como arquivo estático.
#
# "publish" é a raiz do repositório, então netlify/functions/isocrona.mjs
# ficaria legível em /netlify/functions/isocrona.mjs. A chave não está no
# código (está no ambiente), então não é vazamento de credencial — mas é
# entregar o mapa das validações a quem queira contorná-las.
#
# Não dá para resolver com "rm -rf ./netlify" no command, como foi feito
# com tools/: o command roda ANTES do empacotamento das funções, e
# apagaria a própria função. Daí o 404 por caminho.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
