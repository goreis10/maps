[build]
  # Site estático de arquivo único — sem build de código.
  # O "command" apenas REMOVE do output publicado os arquivos de
  # documentação/notas (*.md) — eles continuam no repositório, mas não
  # ficam acessíveis pelo site. Cobre CLAUDE.md, README.md e qualquer
  # outro .md que exista ou venha a existir na raiz.
  publish = "."
  command = "rm -rf ./tools && rm -f ./*.md ./*.markdown"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Dataset do Censo 2022, um arquivo por UF. Imutável — os dados são de
# julho/2022 e não mudam. Cache longo para o visitante baixar cada estado
# uma única vez, não uma vez por sessão. O manifesto fica de fora: é
# pequeno e muda quando um estado novo entra.
[[headers]]
  for = "/censo/*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/censo/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Bloqueio de arquivos de configuração conhecidos (retorna 404).
# Redirects só casam caminhos exatos (não curinga por extensão), por isso
# os .md são tratados pelo "command" acima, e os configs são listados aqui.
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
